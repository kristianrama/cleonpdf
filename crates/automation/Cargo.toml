[package]
name = "cleonpdf-automation"
description = "Agent control for CleonPDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cleonpdf-engine = { workspace = true }
cleonpdf-net = { workspace = true }
cleonpdf-cos = { workspace = true }
cleonpdf-render = { workspace = true }
cleonpdf-organize = { workspace = true }
cleonpdf-platform = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
png = "0.18"
base64 = { version = "0.22", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
cleonpdf-fonts = { workspace = true }
flate2.workspace = true
cleonpdf-model = { workspace = true }
cleonpdf-xfa = { workspace = true }
cleonpdf-sign = { workspace = true }
# A SoftHSM token for the PKCS #11 tool tests.
cryptoki = "0.12"
secrecy = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
