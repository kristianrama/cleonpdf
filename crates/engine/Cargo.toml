[package]
name = "cleonpdf-engine"
description = "CleonPDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cleonpdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
cleonpdf-render = { workspace = true }
cleonpdf-cos = { workspace = true }
cleonpdf-organize = { workspace = true }
cleonpdf-annot = { workspace = true }
cleonpdf-forms = { workspace = true }
cleonpdf-xfa = { workspace = true }
cleonpdf-edit = { workspace = true }
cleonpdf-audit = { workspace = true }
cleonpdf-redact = { workspace = true }
cleonpdf-print = { workspace = true }
cleonpdf-xfdf = { workspace = true }
cleonpdf-sign = { workspace = true }
cleonpdf-optimize = { workspace = true }
cleonpdf-a11y = { workspace = true }
cleonpdf-ocr = { workspace = true }
cleonpdf-js = { workspace = true }
cleonpdf-compare = { workspace = true }
cleonpdf-preflight = { workspace = true }
cleonpdf-export = { workspace = true }
cleonpdf-fonts = { workspace = true }
cleonpdf-create = { workspace = true }
cleonpdf-model = { workspace = true }
cleonpdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
