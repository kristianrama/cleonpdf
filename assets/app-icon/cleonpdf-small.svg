<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- CleonPDF app icon. Original artwork for CleonPDF, MIT OR Apache-2.0 (LICENSE.txt).
       A page with an amber folded corner and a bold C, on a navy tile. No fonts or images. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24447f"/>
      <stop offset="1" stop-color="#12244a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <!-- The page's shadow, then the page with its top-right corner folded down. -->
    <path d="M146 88H308L392 172V422a26 26 0 0 1-26 26H146a26 26 0 0 1-26-26V114a26 26 0 0 1 26-26Z" fill="#0a1630" fill-opacity="0.45"/>
    <path d="M146 76H308L392 160V410a26 26 0 0 1-26 26H146a26 26 0 0 1-26-26V102a26 26 0 0 1 26-26Z" fill="#f7f3ea"/>
    <path d="M308 76V138a22 22 0 0 0 22 22H392Z" fill="#f2a93b"/>
    <!-- The C: an arc open to the right. -->
    <path d="M308.21 233.58A84 84 0 1 0 308.21 358.42" fill="none" stroke="#1d3461" stroke-width="46" stroke-linecap="round"/>
  </g>
</svg>
