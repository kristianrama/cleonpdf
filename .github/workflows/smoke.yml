# Throwaway smoke test, on an orphan branch (no history shared with main, so it can't be merged).
name: Smoke test
on:
  push:
    branches: [smoke/platforms]
permissions:
  contents: write
jobs:
  glass:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clone main
        run: git clone -q --depth 1 -b main "https://github.com/${{ github.repository }}" src
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Build with the document area opaque and the panels glass
        run: |
          mkdir -p shots/glass-compare
          git -C src apply ../smoke/glass-frame.patch
          git -C src diff --stat
          cargo build --manifest-path src/Cargo.toml -p cleonpdf > "shots/glass-compare/${{ matrix.os }}-frame-build.log" 2>&1
      - name: Screenshots, panels glass
        run: bash smoke/glass-compare.sh src/target/debug/cleonpdf shots/glass-compare ${{ matrix.os }}-frame
      - name: Commit the screenshots to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -q -m "Smoke results ${{ matrix.os }}"
          for _ in 1 2 3 4 5; do git pull -q --rebase origin smoke/platforms && git push -q origin HEAD:smoke/platforms && break; sleep 5; done
