# Throwaway smoke test, on an orphan branch (no history shared with main, so it can't be merged).
name: Smoke test
on:
  push:
    branches: [smoke/platforms]
permissions:
  contents: read
env:
  TAG: v0.1.0
  V: 0.1.0
  BASE: https://github.com/kristianrama/cleonpdf/releases/download/v0.1.0
jobs:
  macos-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSL -o app.dmg "$BASE/cleonpdf-$V-macos-universal.dmg"
          curl -fsSL -o cli.zip "$BASE/cleonpdf-cli-$V-macos-universal.zip"
          unzip -q cli.zip -d cli
          bash smoke/mac.sh release app.dmg "$(find cli -name cleonpdf-cli -type f | head -1)" shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-macos-release
          path: shots
  macos-main:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: src
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo build --manifest-path src/Cargo.toml -p cleonpdf -p cleonpdf-cli
      - run: bash smoke/mac.sh main src/target/debug/cleonpdf src/target/debug/cleonpdf-cli shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-macos-main
          path: shots
  linux-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb openbox imagemagick x11-xserver-utils \
            mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libfuse2 desktop-file-utils >/dev/null
          curl -fsSL -o app.AppImage "$BASE/cleonpdf-$V-linux-x86_64.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/cleonpdf.deb" "$BASE/cleonpdf-$V-linux-x86_64.deb"
          curl -fsSL -o cli.tar.gz "$BASE/cleonpdf-cli-$V-linux-x86_64.tar.gz"
          mkdir cli && tar -xzf cli.tar.gz -C cli
          bash smoke/linux.sh "$PWD/app.AppImage" "$RUNNER_TEMP/cleonpdf.deb" "$(find "$PWD/cli" -name cleonpdf-cli -type f | head -1)" shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-linux-release
          path: shots
  collect:
    needs: [macos-release, macos-main, linux-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          merge-multiple: true
          path: shots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -q -m "Smoke test results" && git push origin HEAD:smoke/platforms
