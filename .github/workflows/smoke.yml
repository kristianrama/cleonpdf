# Throwaway smoke test, on an orphan branch (no history shared with main, so it can't be merged).
name: Smoke test
on:
  push:
    branches: [smoke/platforms]
permissions:
  contents: read
env:
  BASE: https://github.com/kristianrama/cleonpdf/releases/download/v0.1.0
jobs:
  macos-dmg:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild the DMG with the new layout and open it
        run: |
          set -u
          mkdir -p shots
          curl -fsSL -o app.dmg "$BASE/cleonpdf-0.1.0-macos-universal.dmg"
          hdiutil attach app.dmg -nobrowse -readonly -mountpoint /tmp/old -quiet
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/.background"
          cp -R /tmp/old/CleonPDF.app "$stage/"
          hdiutil detach /tmp/old -quiet
          ln -s /Applications "$stage/Applications"
          cp smoke/background.tiff "$stage/.background/background.tiff"
          cp smoke/dmg-layout.DS_Store "$stage/.DS_Store"
          hdiutil create -srcfolder "$stage" -volname CleonPDF -fs HFS+ -format UDZO -ov new.dmg -quiet
          open new.dmg
          sleep 10
          screencapture -x shots/dmg-new-layout.png
          osascript -e 'tell application "Finder" to get bounds of front window' > shots/dmg-bounds.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-macos-dmg
          path: shots
  collect:
    needs: [macos-dmg]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          merge-multiple: true
          path: shots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -q -m "Smoke test results" && git push origin HEAD:smoke/platforms
