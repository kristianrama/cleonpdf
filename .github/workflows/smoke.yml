# Throwaway smoke test, on an orphan branch (no history shared with main, so it can't be merged).
name: Smoke test
on:
  push:
    branches: [smoke/platforms]
permissions:
  contents: read
jobs:
  glass:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/macos-glass
          path: src
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Build
        run: cargo build --manifest-path src/Cargo.toml -p cleonpdf 2>&1 | tail -40
      - name: Screenshots
        run: bash smoke/glass.sh src/target/debug/cleonpdf shots ${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: shots
  collect:
    needs: [glass]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          merge-multiple: true
          path: shots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -q -m "Smoke test results" && git push origin HEAD:smoke/platforms
