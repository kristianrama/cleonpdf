name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every night the whole workflow runs on main with the 15-minute fuzz job, so new crashes and
  # new RustSec advisories show up before a pull request meets them (free on a public
  # repository; GitHub pauses schedules after 60 days without activity). Run by hand
  # (Actions → CI → Run workflow) to fuzz any branch.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the whole suite too: the repository is public, so its minutes are free (on a
        # private one they cost about ten times Linux ones; drop macos-latest from this list then,
        # release.yml builds macOS anyway).
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The optional craft-fonts build input (Japanese, Chinese and other script fonts), so the
      # font tests run on Linux; Windows tests the build without it. The same pin as release.yml.
      - name: Check out craft-fonts (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts

      - name: Configure craft-fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Require Windows executable resources
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CLEONPDF_REQUIRE_WINRES=1'
        shell: pwsh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      - name: Test (with craft-fonts)
        if: runner.os == 'Linux'
        run: cargo test --workspace

      - name: Layering
        if: runner.os == 'Linux'
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        if: runner.os == 'Linux'
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        if: runner.os == 'Linux'
        run: cargo check -p cleonpdf-cli --no-default-features

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  interop:
    name: interop (qpdf, Poppler, MuPDF, Ghostscript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: interop
      # Other readers, run as external processes on every kind of PDF we write (never linked).
      - name: Install the readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils mupdf-tools ghostscript
      - name: Interop suite
        run: cargo xtask interop --require-all
      - name: Render oracle (page images against MuPDF and Poppler)
        run: cargo xtask render-oracle --require-all
      - name: Upload the outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-out
          path: |
            interop-out/out
            render-oracle-out
          if-no-files-found: ignore

  pkcs11:
    name: PKCS #11 (SoftHSM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pkcs11
      # SoftHSM is a software token with the real PKCS #11 interface; it is loaded by the tests
      # as a user would load a card's library, and never linked.
      - name: Install SoftHSM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - name: Give the tests a token directory of their own
        run: |
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s/softhsm/tokens\nobjectstore.backend = file\nlog.level = ERROR\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          module="$(find /usr/lib -name libsofthsm2.so | head -n 1)"
          test -n "$module"
          {
            echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf"
            echo "CLEONPDF_TEST_PKCS11_MODULE=$module"
            echo "CLEONPDF_REQUIRE_PKCS11=1"
          } >> "$GITHUB_ENV"
      - name: PKCS #11 tests
        run: |
          cargo test -p cleonpdf-sign -p cleonpdf-automation --test pkcs11 -- --test-threads=1
          cargo test -p cleonpdf-ui-egui --test signing_token -- --test-threads=1

  interop-macos:
    name: interop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: interop-macos
      # The same four readers as on Linux (Homebrew's `mupdf` provides `mutool`), run as external
      # processes on every kind of PDF we write.
      - name: Install the readers
        run: brew install qpdf poppler mupdf ghostscript
      - name: Interop suite
        run: cargo xtask interop --require-all
      - name: Upload the outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-out-macos
          path: interop-out/out
          if-no-files-found: ignore

  interop-windows:
    name: interop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: interop-windows
      # The same four readers as on Linux and macOS, run as external processes on every kind of
      # PDF we write. Chocolatey puts a shim for each program in its bin folder, which is on PATH.
      - name: Install the readers
        shell: pwsh
        run: |
          choco install qpdf poppler mupdf ghostscript -y --no-progress
          # Ghostscript's installer puts its programs in Program Files, not in a shim.
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $gs.FullName 'bin')
      - name: Interop suite
        run: cargo xtask interop --require-all
      - name: Upload the outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-out-windows
          path: interop-out/out
          if-no-files-found: ignore

  print-windows:
    name: print (Windows spooler)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: print-windows
      # The runner has the spooler and Windows' own "Microsoft Print to PDF" driver. A queue on
      # that driver whose port is a file takes a job without showing a dialog and writes a PDF,
      # so a real job can go through the real spooler and driver and be read back.
      - name: Create a print queue that writes a file
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'spooled.pdf'
          Add-PrinterPort -Name $out
          Add-Printer -Name 'CleonPDF test' -DriverName 'Microsoft Print To PDF' -PortName $out
          Add-Content -Path $env:GITHUB_ENV -Value "CLEONPDF_TEST_PRINTER=CleonPDF test"
          Add-Content -Path $env:GITHUB_ENV -Value "CLEONPDF_TEST_PRINTER_FILE=$out"
          Add-Content -Path $env:GITHUB_ENV -Value "CLEONPDF_TEST_PRINTER_REQUIRED=1"
      - name: Print through the Windows spooler
        run: cargo test -p cleonpdf-print --test windows_spooler -j 2 -- --nocapture
      - name: Upload what the queue wrote
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-windows-output
          path: ${{ runner.temp }}/spooled.pdf
          if-no-files-found: ignore

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore
