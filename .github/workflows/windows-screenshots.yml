# Throwaway: runs only on this branch, which is deleted afterwards.
name: Windows screenshots
on:
  push:
    branches: [chore/windows-screenshots]
permissions:
  contents: write  # to read the draft release
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the MSI from the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.draft)][0].assets[] | select(.name | endswith(".msi")) | .id')
          gh api -H 'Accept: application/octet-stream' repos/${{ github.repository }}/releases/assets/$id > cleonpdf.msi
          ls -la cleonpdf.msi
      - name: Screen resolution
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; 'set 1920x1080' } catch { "Set-DisplayResolution failed: $_" }
      - name: Install and take screenshots
        shell: pwsh
        run: ./.github/windows-screenshots/run.ps1 -Msi cleonpdf.msi -Pdf .github/windows-screenshots/showcase.pdf -Out shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screenshots
          path: shots
      - name: Commit the screenshots to this branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots && git commit -q -m "Windows screenshots" && git push origin HEAD:chore/windows-screenshots
