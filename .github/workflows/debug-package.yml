name: debug-package
on:
  push:
    branches: [debug/package-0.2.0]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Take the OCR models from the v0.1.4 package and mirror them if they are the pinned ones
        run: |
          set +e
          {
            mkdir -p dl && cd dl
            gh release download v0.1.4 --repo "$GITHUB_REPOSITORY" -p 'cleonpdf-0.1.4-linux-x86_64.tar.gz'
            tar -xzf cleonpdf-0.1.4-linux-x86_64.tar.gz --wildcards '*/share/cleonpdf/models/*' 2>&1 | tail -2
            ls -la */share/cleonpdf/models/
            det=$(ls */share/cleonpdf/models/text-detection.rten)
            rec=$(ls */share/cleonpdf/models/text-recognition.rten)
            sd=$(sha256sum "$det" | cut -c1-64); sr=$(sha256sum "$rec" | cut -c1-64)
            echo "detection $sd"; echo "recognition $sr"
            if [ "$sd" = f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca ] && [ "$sr" = e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e ]; then
              echo "hashes match the pins"
              gh release create ocr-models-1 --repo "$GITHUB_REPOSITORY" --target 1b05394b6517f4bae4e4400b0e7eceaadb22407f --prerelease --latest=false \
                --title "OCR models mirror (not a CleonPDF release)" \
                --notes "The two unmodified Scan & OCR models CleonPDF packages (text-detection.rten, text-recognition.rten) by Robert Knight, from https://github.com/robertknight/ocrs-models, licence CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). Mirrored here because the original download host (ocrs-models.s3-accelerate.amazonaws.com) now answers AccessDenied. `cargo xtask models` downloads them from here and checks their SHA-256 against ATTRIBUTION.toml. This is not a CleonPDF release." \
                "$det" "$rec"
              echo "release create exit=$?"
            else
              echo "hashes DO NOT match the pins; nothing mirrored"
            fi
          } > mirror.log 2>&1
          msg=$(cut -c1-400 mirror.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=mirror::$msg"
