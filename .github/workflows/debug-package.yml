name: debug-package
on:
  push:
    branches: [debug/package-0.2.0]
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CRAFT_FONTS_REQUIRED: "1"
      CLEONPDF_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev desktop-file-utils appstream
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - name: Package, with the error lines as annotations
        run: |
          set +e
          packaging/linux/package.sh --formats "tar cli" > pkg.log 2>&1
          code=$?
          grep -nE "error|Error|failed|FAIL|denied|mismatch" pkg.log | tail -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          tail -12 pkg.log | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
          exit $code
