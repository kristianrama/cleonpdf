name: debug-package
on:
  push:
    branches: [debug/package-0.2.0]
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CRAFT_FONTS_REQUIRED: "1"
      CLEONPDF_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev desktop-file-utils appstream
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - name: Fetch the OCR models alone and print everything
        run: |
          set +e
          {
            cargo xtask models /tmp/models
            echo "xtask exit=$?"
            curl -sSIL -o /dev/null -w "model url: http %{http_code} final %{url_effective}\n" https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten
            curl -sSIL -o /dev/null -w "licence url: http %{http_code} final %{url_effective}\n" https://creativecommons.org/licenses/by-sa/4.0/legalcode.txt
            ls -la /tmp/models
          } > models.log 2>&1
          sed 's/\x1b\[[0-9;]*m//g' models.log | tail -30 | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
