name: debug-package
on:
  push:
    branches: [debug/package-0.2.0]
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      CRAFT_FONTS_REQUIRED: "1"
      CLEONPDF_VERSION: "0.2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev desktop-file-utils appstream
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - name: Probe model URLs
        run: |
          set +e
          {
            for u in \
              https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten \
              https://ocrs-models.s3.amazonaws.com/text-detection.rten \
              https://huggingface.co/robertknight/ocrs/resolve/main/text-detection.rten \
              https://huggingface.co/robertknight/ocrs/resolve/main/text-recognition.rten; do
              code=$(curl -sSL -o body.bin -w "%{http_code}" "$u")
              echo "$u -> http $code size $(stat -c %s body.bin) sha256 $(sha256sum body.bin | cut -c1-64)"
              if [ "$code" != 200 ]; then head -c 300 body.bin | tr '\n' ' '; echo; fi
            done
            echo "want detection e484866d.. no: f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca / recognition e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e"
          } > probe.log 2>&1
          msg=$(cut -c1-400 probe.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=probe::$msg"
