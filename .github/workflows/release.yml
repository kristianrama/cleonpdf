name: Release

# Builds every installer and creates (or updates) a DRAFT GitHub Release named
# "CleonPDF v<version>". Nobody sees a draft until it is published by hand. See docs/releasing.md.
#
# Self-contained: every action is pinned to a commit, and every downloaded tool is pinned to a
# version and checked against its SHA-256. Signing is optional; without the secrets the builds
# are unsigned (Windows) or ad-hoc signed and not notarized (macOS), with a warning. Windows can
# also be signed through SignPath (the "windows (SignPath)" job; docs/code-signing.md).

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.9.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Japanese and Simplified Chinese fonts for the UI fallback and edited PDFs, and the other
  # script faces (an OFL font repository; see NOTICE). Releases fail rather than ship without
  # them. The pin must hold fonts/simplified-chinese-manifest.txt (#826).
  CRAFT_FONTS_REF: aced4137c022f1f587624d48e81ec77e1914a9cc
  CRAFT_FONTS_REQUIRED: "1"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      linux: ${{ steps.linux.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          CLEONPDF_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "${CLEONPDF_VERSION:-}" ] || unset CLEONPDF_VERSION
          . packaging/env.sh
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::not a version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          echo "### CleonPDF v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - id: linux
        name: Linux matrix
        # Actions minutes are free only for public repositories, so a private one builds Linux
        # x86_64 only, to save its monthly minutes.
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          all='[
            {"arch": "x86_64", "runner": "ubuntu-22.04",
             "nfpm_deb": "nfpm_2.47.0_amd64.deb",
             "nfpm_sha256": "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97",
             "appimagetool_sha256": "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0",
             "runtime_sha256": "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"},
            {"arch": "aarch64", "runner": "ubuntu-22.04-arm",
             "nfpm_deb": "nfpm_2.47.0_arm64.deb",
             "nfpm_sha256": "27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97",
             "appimagetool_sha256": "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158",
             "runtime_sha256": "00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"}
          ]'
          if [ "$PRIVATE" = true ]; then
            all="$(jq '[.[] | select(.arch == "x86_64")]' <<<"$all")"
            echo "Private repository: Linux aarch64 is not built." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix=$(jq -c '{include: .}' <<<"$all")" >> "$GITHUB_OUTPUT"

  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.linux) }}
    # Ubuntu 22.04 (glibc 2.35), so the binaries also run on newer distributions.
    runs-on: ${{ matrix.runner }}
    env:
      CLEONPDF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install build and packaging tools
        env:
          NFPM_DEB: ${{ matrix.nfpm_deb }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev zsync desktop-file-utils appstream
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          fetch() { # url, file, sha256
            curl -fsSL --retry 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/$NFPM_DEB" "$tools/nfpm.deb" "$NFPM_SHA256"
          sudo dpkg -i "$tools/nfpm.deb"
          fetch "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage" "$tools/appimagetool" "$APPIMAGETOOL_SHA256"
          fetch "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$ARCH" "$tools/runtime" "$RUNTIME_SHA256"
          chmod +x "$tools/appimagetool"
          {
            echo "APPIMAGETOOL=$tools/appimagetool"
            echo "APPIMAGE_RUNTIME=$tools/runtime"
            echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Package
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macos (universal)
    needs: version
    runs-on: macos-15
    env:
      CLEONPDF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - run: echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos
      - name: Import the signing certificate (skipped without secrets)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Package (notarized only with the Apple secrets)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: windows (x64)
    needs: version
    runs-on: windows-latest
    env:
      CLEONPDF_VERSION: ${{ needs.version.outputs.version }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - run: Add-Content -Path $env:GITHUB_ENV -Value "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\craft-fonts"
        shell: pwsh
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x64
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
        shell: pwsh
      - name: Package (signed only with the signing secrets)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: pwsh packaging/windows/package.ps1 -Arch x64
        shell: pwsh
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x64
          path: dist/release/*
          if-no-files-found: error

  # Windows signing through SignPath, free for open source (docs/code-signing.md). Runs only when
  # the repository variable SIGNPATH_ORGANIZATION_ID is set. SignPath signs cleonpdf.exe and
  # cleonpdf-cli.exe inside the MSI and the portable zip, then the MSI
  # (packaging/windows/signpath-artifact-configuration.xml), once an approver approves the request
  # in SignPath; this job waits up to four hours for that. The signed files replace the unsigned
  # dist-windows-x64 artifact, so the draft gets them. If signing fails, there is no draft.
  windows-signing:
    name: windows (SignPath)
    needs: [version, windows]
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Sign (waits for approval in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cleonpdf' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.windows.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Check the signed files
        run: |
          set -euo pipefail
          ls -la signed
          test -f "signed/cleonpdf-$VERSION-windows-x64.msi"
          test -f "signed/cleonpdf-$VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x64
          path: signed/*
          if-no-files-found: error
          overwrite: true

  web:
    name: web
    needs: version
    runs-on: ubuntu-latest
    env:
      CLEONPDF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - run: echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-web
      - name: Install trunk
        run: cargo install trunk --version 0.21.13 --locked
      - name: Package
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/release/*
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, linux, macos, windows, windows-signing, web]
    # windows-signing is skipped when SignPath isn't set up; when it is, its failure stops the draft.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' && needs.windows.result == 'success' && needs.web.result == 'success' &&
      (needs.windows-signing.result == 'success' || needs.windows-signing.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * | grep -v ' SHA256SUMS.txt$' > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the draft
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              # Prepended to the generated notes: SignPath Foundation asks that the download page
              # name the code signing policy.
              notes="Code signing policy: https://github.com/$GH_REPO/blob/main/docs/code-signing.md"
              flags=(--draft --title "CleonPDF $tag" --target "$GITHUB_SHA" --generate-notes --notes "$notes")
              [ "$PRERELEASE" = true ] && flags+=(--prerelease)
              gh release create "$tag" "${flags[@]}" dist/*
              ;;
            true)
              # The draft's tag is created when it is published, at its target: move the target
              # to this build, or the tag would name the commit of the first build.
              gh release edit "$tag" --target "$GITHUB_SHA"
              gh release upload "$tag" dist/* --clobber
              ;;
            *)
              echo "::error::release $tag is already published; bump the version instead of rebuilding it"
              exit 1
              ;;
          esac
          echo "Draft: https://github.com/$GH_REPO/releases (CleonPDF $tag)" >> "$GITHUB_STEP_SUMMARY"
